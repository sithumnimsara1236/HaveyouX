<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ponnayo Filter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      text-align: center;
      padding-top: 100px;
    }
    .hidden {
      display: none;
    }
    input {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #00f;
      color: #fff;
      border: none;
      border-radius: 5px;
    }
    .scroll-text {
      white-space: nowrap;
      overflow: hidden;
      position: relative;
      font-size: 24px;
      margin-top: 100px;
    }

    .scroll-text p {
      display: inline-block;
      padding-left: 100%;
      animation: scroll-left 10s linear infinite;
      color: red;
    }

    @keyframes scroll-left {
      0% {
        transform: translateX(100%);
      }
      100% {
        transform: translateX(-100%);
      }
    }
  </style>
</head>
<body>

  <div id="formPage">
    <h2>Type your name and age</h2>
    <input type="text" id="name" placeholder="Your name" />
    <input type="number" id="age" placeholder="Your age" />
    <br />
    <button onclick="goToNextPage()">Submit</button>
  </div>

  <div id="nextPage" class="hidden">
    <div class="scroll-text">
      <p>SAHAS wage ponnayanta mekata enn ba</p>
    </div>
  </div>

  <script>
    function goToNextPage() {
      const name = document.getElementById("name").value;
      const age = document.getElementById("age").value;
      if(name && age) {
        document.getElementById("formPage").classList.add("hidden");
        document.getElementById("nextPage").classList.remove("hidden");
      } else {
        alert("Type karapan name ekai age ekai!");
      }
    }
  </script>

</body>
</html>
